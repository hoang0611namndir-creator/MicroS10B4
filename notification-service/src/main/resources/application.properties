spring.application.name=notification-service
server.port=8084
# optional: neu Config Server chua chay thi service van len, dung gia tri mac dinh (che do MOCK)
spring.config.import=optional:configserver:http://localhost:8888

# ===============================
# DATABASE
# ===============================

spring.datasource.url=jdbc:postgresql://localhost:5432/pharmacy
spring.datasource.username=postgres
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# ===============================
# KAFKA
# ===============================

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=inventory-service-group

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.pharmacy.service.event